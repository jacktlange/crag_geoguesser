name: Daily Crag Guesser

on:
  schedule:
    # Every day, a few times just after midnight Mountain Time, plus one extra run at 14:07 UTC
    # (7 am). Midnight there is 06:00 UTC in summer and 07:00 UTC in winter, so the runs start
    # at 06:07 and go hourly to 09:07 UTC. Any run builds today's puzzle if it doesn't exist yet
    # and stops within seconds if it does, so the first run after midnight does the work and the
    # rest are a safety net: GitHub often delays or drops scheduled runs, and a missed one is
    # made up by the next. Weekdays only? Change the last * to 1-5.
    - cron: "7 6,7,8,9,14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's set even if it already exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crag-guesser
  cancel-in-progress: false

env:
  TZ_NAME: America/Denver   # defines "today" and the posting hour
  PHOTOS_PER_DAY: "5"

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Check out the newest main when the job actually starts. A run that waited in the queue
      # would otherwise use the commit from when it was first triggered, which can be out of date.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build today's set
        id: daily
        if: github.event_name != 'push'
        run: |
          ARGS="--tz $TZ_NAME --count $PHOTOS_PER_DAY"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python3 scripts/daily.py $ARGS

      - name: Save the new set to the repository
        if: github.event_name != 'push' && steps.daily.outputs.skip != 'true'
        run: |
          git config user.name "crag-guesser-bot"
          git config user.email "crag-guesser-bot@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Daily set for ${{ steps.daily.outputs.date }}"
          pushed=0
          for attempt in 1 2 3; do
            if git push; then pushed=1; break; fi
            # Someone pushed while this job was running: fold their changes in underneath ours, then retry.
            git pull --rebase origin main || { git rebase --abort; echo "::error::Could not combine with newer changes on main."; exit 1; }
          done
          [ "$pushed" = 1 ] || { echo "::error::Could not push after 3 tries."; exit 1; }

      # When a scheduled run has nothing new to build, make sure the live site actually shows
      # the latest puzzle. If a deploy failed earlier, this run publishes the site again.
      - name: Check the live site is up to date
        id: live
        if: github.event_name == 'schedule' && steps.daily.outputs.skip == 'true'
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          URL="${PAGES_URL:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/}"
          WANT=$(python3 -c "import json; print(json.load(open('site/data/today.json'))['date'])" 2>/dev/null || echo none)
          GOT=$(curl -fsS "${URL%/}/data/today.json?nocache=$(date +%s)" | python3 -c "import sys, json; print(json.load(sys.stdin)['date'])" 2>/dev/null || echo none)
          echo "Latest puzzle in the repository: $WANT. On the live site: $GOT."
          if [ "$WANT" != "$GOT" ]; then echo "redeploy=true" >> "$GITHUB_OUTPUT"; fi

      # Publish when a puzzle was built, when the live site is behind, and on every manual run
      # (so "Run workflow" can always repair a site that is out of date).
      - uses: actions/configure-pages@v5
        if: steps.daily.outputs.skip != 'true' || steps.live.outputs.redeploy == 'true' || github.event_name == 'workflow_dispatch'

      - uses: actions/upload-pages-artifact@v3
        if: steps.daily.outputs.skip != 'true' || steps.live.outputs.redeploy == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: site

      - name: Publish the page
        id: deploy
        if: steps.daily.outputs.skip != 'true' || steps.live.outputs.redeploy == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4

      - name: Post to Discord
        if: github.event_name != 'push' && steps.daily.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: python3 scripts/post_discord.py

      - name: Tell Discord if something broke
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK_URL" ] || exit 0
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"content\":\":warning: Crag Guesser's daily run failed. Logs: <$RUN_URL>\"}" \
            "$DISCORD_WEBHOOK_URL"
